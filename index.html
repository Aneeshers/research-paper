<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Template</title>
    <meta
      name="description"
      content="Reusable static project page template for research papers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Paper Template" />
    <meta
      property="og:description"
      content="Reusable static project page template for research papers."
    />
    <meta property="og:image" content="assets/figures/placeholder-wide.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site">
      <header class="topbar">
        <a class="brand" href="#top">paper-template</a>
        <nav class="nav" id="nav" aria-label="Primary"></nav>
      </header>

      <main id="top" class="page">
        <section class="hero" id="hero"></section>
        <section class="meta-grid" id="meta-grid"></section>
        <section class="body-grid">
          <aside class="toc-shell">
            <div class="toc-card">
              <p class="toc-label">Contents</p>
              <nav id="toc" aria-label="Table of contents"></nav>
            </div>
          </aside>
          <div class="sections" id="sections"></div>
        </section>
      </main>

      <footer class="footer" id="footer"></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
